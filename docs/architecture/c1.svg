<text x="1539" y="788" font-size="28" text-anchor="middle" font-weight="400">Delivers verification,</text>
<text x="1539" y="829" font-size="28" text-anchor="middle" font-weight="400">password-reset and security</text>
<text x="1539" y="870" font-size="28" text-anchor="middle" font-weight="400">emails.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">C1 - Context Diagram | SocialU</title><desc id="desc">A Student person uses SocialU. SocialU uses Supabase account and storage services and requests account emails from Resend. Resend delivers account emails to the Student.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#395664"/></marker></defs><rect width="1920" height="1080" fill="white"/><g font-family="Arial, sans-serif" fill="#163743">

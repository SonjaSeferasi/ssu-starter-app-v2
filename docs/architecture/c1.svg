<text x="1539" y="325" font-size="28" text-anchor="middle" font-weight="400">[External system]</text>
<text x="1539" y="405" font-size="28" text-anchor="middle" font-weight="400">Managed account services;</text>
<text x="1539" y="446" font-size="28" text-anchor="middle" font-weight="400">stores records and</text>
<text x="1539" y="486" font-size="28" text-anchor="middle" font-weight="400">photographs.</text>

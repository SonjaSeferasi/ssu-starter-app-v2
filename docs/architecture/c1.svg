<text x="865" y="300" font-size="28" text-anchor="middle" font-weight="400">[Software system]</text>
<text x="865" y="380" font-size="27" text-anchor="middle" font-weight="400">University community platform.</text>
<text x="865" y="422" font-size="27" text-anchor="middle" font-weight="400">Feeds, profiles and</text>
<text x="865" y="461" font-size="27" text-anchor="middle" font-weight="400">friendships.</text>
<text x="865" y="500" font-size="27" text-anchor="middle" font-weight="400">Messages and campus events.</text>
<text x="865" y="540" font-size="27" text-anchor="middle" font-weight="400">Games, avatars and virtual</text>
<text x="865" y="580" font-size="27" text-anchor="middle" font-weight="400">dorms.</text>
<text x="865" y="623" font-size="27" text-anchor="middle" font-weight="400">Shared streaks and points.</text>
<rect data-node="Supabase" x="1314" y="235" width="450" height="280" fill="#f0f3f5" stroke="#6e7f89" stroke-width="2.5" stroke-dasharray="8 5"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
<title id="title">C2 - Container Diagram | SocialU</title>
<desc id="description">Student uses the Web App. The Web App calls the Backend API and subscribes to Supabase Realtime over secure WebSockets for private and group chat. The API publishes authorized saved chat updates, accesses Supabase Database, Auth and Storage and requests Resend account emails. Resend delivers emails to the Student. This is planned architecture, with authentication and Realtime authorization still pending.</desc>

# GitHub integration Working directory: .
# Local project identifier; the dashboard integration selects the hosted project.
project_id = "ssu-starter-app-v2"

# Required baseline rows are part of the initial migration; there is no demo seed file.
[db.seed]
enabled = false

# SRS 100–105. These settings apply to local Supabase. Mirror them in the hosted
# project's Auth settings; committing this file does not configure hosted Auth.
[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "30s"
otp_length = 6
otp_expiry = 900

[auth.email.template.confirmation]
subject = "SocialU — verify your Salem State university email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "SocialU — your password-reset code"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "SocialU — verify your Salem State university email"
content_path = "./supabase/templates/magic_link.html"

[auth.email.notification.password_changed]
enabled = true
subject = "SocialU — your password was changed"
content_path = "./supabase/templates/password_changed.html"
